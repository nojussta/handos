name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-tools:
    name: Build Linux CLI & Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: ""

      - run: cargo build --release -p handos-cli -p handos-sim
      - run: |
          mkdir -p dist
          tar -czf dist/handos-linux-x86_64.tar.gz -C target/release handos-cli handos-sim

      - uses: actions/upload-artifact@v4
        with:
          name: handos-linux
          path: dist/handos-linux-x86_64.tar.gz

  build-android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-android
        with:
          variant: Release

      - uses: actions/upload-artifact@v4
        with:
          name: handos-android-release
          path: android/app/build/outputs/apk/release/*.apk

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-tools, build-android-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
