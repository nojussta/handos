name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-tools:
    name: Build Linux CLI & Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: ""

      - run: cargo build --release -p handos-cli -p handos-sim
      - run: |
          mkdir -p dist
          tar -czf dist/handos-linux-x86_64.tar.gz -C target/release handos-cli handos-sim

      - uses: actions/upload-artifact@v7
        with:
          name: handos-linux
          path: dist/handos-linux-x86_64.tar.gz

  build-android-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-android
        with:
          variant: Debug

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk handos-android-alpha.apk

      - uses: actions/upload-artifact@v7
        with:
          name: handos-android-apk
          path: handos-android-alpha.apk

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-tools, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
