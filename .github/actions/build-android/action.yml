name: Build Android APK
description: Builds libhandos_core.so via cargo-ndk and compiles the Android APK.
inputs:
  variant:
    description: Gradle build variant (Debug or Release)
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi
        components: ""

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Ensure Android SDK 35 is installed
      shell: bash
      run: |
        SDK_MGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
        yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
        "$SDK_MGR" "platforms;android-35" "build-tools;35.0.0" >/dev/null

    - name: Build libhandos_core.so
      shell: bash
      run: |
        cargo ndk -t arm64-v8a -t armeabi-v7a -o apps/android/app/src/main/jniLibs build --release -p handos-core

    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: "8.10.2"

    - name: Build ${{ inputs.variant }} APK
      shell: bash
      working-directory: apps/android
      run: gradle assemble${{ inputs.variant }} --no-daemon --console=plain
